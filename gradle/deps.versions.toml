[versions]
annotations = "26.1.0"
jspecify = "1.0.0"
assertj = "3.27.7"
javaparser = "3.27.1"
scalafmt = "3.11.2"

jei = "15.20.0.133"
scala = "2.13.12"
scala3 = "3.3.1"
cats = "2.10.0-kotori"
scalablecatsforce = "3.3.1-build-0"
gtceu = "7.5.3"
registrate = "MC1.20-1.3.11"
# Pinned to the exact ldlib build jar-in-jar'd inside gtceu 7.5.3 so the
# Scala compiler can resolve ldlib types (BlockInfo, IEnhancedManaged, etc.)
# on CI without the gitignored libs/ jar.
ldlib = "1.0.40.b"
# Toma Configuration, the config library GTCEu itself uses. gtceu 7.5.3 jar-in-jars
# 2.2.0 and declares it mandatory + embedded in its mods.toml, so that build is what
# we get at RUNTIME and a compileOnly dep is enough here.
#
# 2.2.0 is no longer published under any live coordinate (Toma's repsy maven now only
# serves configuration-1.20.1:3.1.0-forge; the old configuration-forge-1.20.1 artifact
# is gone), so we compile against 3.1.0-forge instead. Every member we touch --
# Configuration.registerConfig(Class, IConfigFormatHandler), ConfigFormats.yaml(),
# ConfigHolder.getConfigInstance(), and the @Config / @Configurable{,.Comment,.Range,
# .FixedSize} annotations -- has an identical descriptor in 2.2.0, so the emitted
# references resolve against the runtime build. Verify that still holds before using
# any additional API from this library.
configuration = "3.1.0-forge"

[libraries]
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
javaparser-core = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
scalafmt-cli = { module = "org.scalameta:scalafmt-cli_2.13", version.ref = "scalafmt" }

jei-common-api = { module = "mezz.jei:jei-1.20.1-common-api", version.ref = "jei" }
jei-forge-api = { module = "mezz.jei:jei-1.20.1-forge-api", version.ref = "jei" }
jei-forge-impl = { module = "mezz.jei:jei-1.20.1-forge", version.ref = "jei" }

cats = { module = "org.typelevel:cats-core_3", version.ref = "cats" }
scala = { module = "org.scala-lang:scala-library", version.ref = "scala" }
scala3 = { module = "org.scala-lang:scala3-library_3", version.ref = "scala3" }
scalablecatsforce = { module = "com.kotori316:scalablecatsforce", version.ref = "scalablecatsforce" }

gtceu = { module = "com.gregtechceu.gtceu:gtceu-1.20.1", version.ref = "gtceu" }
registrate = { module = "com.tterrag.registrate:Registrate", version.ref = "registrate" }
ldlib = { module = "com.lowdragmc.ldlib:ldlib-forge-1.20.1", version.ref = "ldlib" }
configuration = { module = "dev.toma.configuration:configuration-1.20.1", version.ref = "configuration" }

[bundles]
jei = ["jei-common-api", "jei-forge-api", "jei-forge-impl"]
